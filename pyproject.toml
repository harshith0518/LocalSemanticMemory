[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "jarvis"
version = "0.1.0"
description = "Local-first semantic memory with cited, source-backed recall"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.16,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.11,<3",
  "sqlalchemy>=2.0,<2.1",
  "typer>=0.16,<1",
  "uvicorn>=0.35,<1",
]

[project.scripts]
jarvis = "jarvis.cli:app"

[tool.hatch.build.targets.wheel.force-include]
"src/jarvis/web" = "jarvis/web"

[dependency-groups]
dev = ["hatchling==1.27.0", "pytest>=8.4,<10", "ruff>=0.12,<1"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
