name: jarvis

x-app: &app
  image: jarvis:local
  build: .
  init: true
  networks: [application]
  # Docker Desktop resolves this name itself; host-gateway supplies the same mapping on Linux.
  # Ollama remains on the host loopback interface rather than becoming a Compose service.
  extra_hosts:
    - "host.docker.internal:host-gateway"

x-runtime-environment: &runtime-environment
  JARVIS_DB_HOST: db
  JARVIS_DB_NAME: jarvis
  JARVIS_DB_USER: jarvis_app
  JARVIS_DB_PASSWORD: ${JARVIS_APP_PASSWORD:?Copy .env.example to .env and set passwords}
  JARVIS_RESPONSE_MODEL: ${JARVIS_RESPONSE_MODEL:-nvidia/nemotron-3.5-lightning-30b-a3b}
  JARVIS_UNFAMILIAR_INFERENCE_APPROVED: ${JARVIS_UNFAMILIAR_INFERENCE_APPROVED:-false}
  JARVIS_UNFAMILIAR_DATA_POLICY_ACK: ${JARVIS_UNFAMILIAR_DATA_POLICY_ACK:-}
  JARVIS_MAX_REQUESTS: ${JARVIS_MAX_REQUESTS:-1100}
  JARVIS_MAX_TOTAL_TOKENS: ${JARVIS_MAX_TOTAL_TOKENS:-10000000}
  # Google is the normal demo route. Set this explicitly to ollama to use the local backup.
  JARVIS_INFERENCE_PROVIDER: ${JARVIS_INFERENCE_PROVIDER:-google}
  JARVIS_FREE_SYNTHETIC_TRIAL_APPROVED: ${JARVIS_FREE_SYNTHETIC_TRIAL_APPROVED:-false}
  JARVIS_FREE_SYNTHETIC_QUESTIONS_APPROVED: ${JARVIS_FREE_SYNTHETIC_QUESTIONS_APPROVED:-false}
  JARVIS_FREE_SYNTHETIC_SOURCES_APPROVED: ${JARVIS_FREE_SYNTHETIC_SOURCES_APPROVED:-false}
  JARVIS_PRIVATE_DIRECT_APPROVED: ${JARVIS_PRIVATE_DIRECT_APPROVED:-false}
  JARVIS_FREE_DATA_POLICY_ACK: ${JARVIS_FREE_DATA_POLICY_ACK:-}
  JARVIS_FREE_EXTRACTOR_MODEL: ${JARVIS_FREE_EXTRACTOR_MODEL:-gemini-3.5-flash-lite}
  JARVIS_FREE_RESPONDER_MODEL: ${JARVIS_FREE_RESPONDER_MODEL:-gemini-3.5-flash-lite}
  # Local-only Ollama backup. Its Python configuration accepts only this host gateway and /v1.
  JARVIS_OLLAMA_ENABLED: ${JARVIS_OLLAMA_ENABLED:-false}
  JARVIS_OLLAMA_BASE_URL: "${JARVIS_OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}"
  JARVIS_OLLAMA_API_KEY: ${JARVIS_OLLAMA_API_KEY:-ollama}
  JARVIS_OLLAMA_EXTRACTOR_MODEL: ${JARVIS_OLLAMA_EXTRACTOR_MODEL:-qwen3:4b}
  JARVIS_OLLAMA_RESPONDER_MODEL: ${JARVIS_OLLAMA_RESPONDER_MODEL:-qwen3:4b}
  # Declared for a future retrieval experiment only; the application does not call embeddings.
  JARVIS_OLLAMA_EMBEDDING_MODEL: ${JARVIS_OLLAMA_EMBEDDING_MODEL:-qwen3-embedding:0.6b}
  JARVIS_OLLAMA_PRIVATE_DIRECT: ${JARVIS_OLLAMA_PRIVATE_DIRECT:-false}

services:
  db:
    image: pgvector/pgvector:0.8.6-pg17-bookworm@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
    environment:
      POSTGRES_DB: jarvis
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${JARVIS_POSTGRES_PASSWORD:?Set JARVIS_POSTGRES_PASSWORD in .env}
      APP_USER: jarvis_app
      APP_PASSWORD: ${JARVIS_APP_PASSWORD:?Set JARVIS_APP_PASSWORD in .env}
      MIGRATION_USER: jarvis_migrate
      MIGRATION_PASSWORD: ${JARVIS_MIGRATION_PASSWORD:?Set JARVIS_MIGRATION_PASSWORD in .env}
    volumes:
      - database:/var/lib/postgresql/data
      - ./docker/postgres/init-db.sh:/docker-entrypoint-initdb.d/10-jarvis.sh:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U postgres -d jarvis']
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [application]

  migrate:
    <<: *app
    command: [alembic, upgrade, head]
    environment:
      <<: *runtime-environment
      JARVIS_DB_USER: jarvis_migrate
      JARVIS_DB_PASSWORD: ${JARVIS_MIGRATION_PASSWORD:?Set JARVIS_MIGRATION_PASSWORD in .env}
    depends_on:
      db: {condition: service_healthy}

  api:
    <<: *app
    logging: {driver: none}
    environment:
      <<: *runtime-environment
      JARVIS_S07_SYNTHETIC_TRIAL_APPROVED: ${JARVIS_S07_SYNTHETIC_TRIAL_APPROVED:-false}
      KIMI_K3_API_KEY: ${KIMI_K3_API_KEY:-}
      NEMOTRON_30B_API_KEY: ${NEMOTRON_30B_API_KEY:-}
      POOLSIDE_LAGUNA_XS_2P1: ${POOLSIDE_LAGUNA_XS_2P1:-}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      GOOGLE_API_KEY_FREE_TIER: ${GOOGLE_API_KEY_FREE_TIER:-}
      OPEN_ROUTER_API_KEY: ${OPEN_ROUTER_API_KEY:-}
    ports: ['127.0.0.1:${JARVIS_API_PORT:-8000}:8000']
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, jarvis, ready]
      interval: 5s
      timeout: 10s
      retries: 12

  cli:
    <<: *app
    logging: {driver: none}
    profiles: [tools]
    entrypoint: [jarvis]
    command: [ready]
    environment:
      <<: *runtime-environment
      JARVIS_S07_SYNTHETIC_TRIAL_APPROVED: ${JARVIS_S07_SYNTHETIC_TRIAL_APPROVED:-false}
      KIMI_K3_API_KEY: ${KIMI_K3_API_KEY:-}
      NEMOTRON_30B_API_KEY: ${NEMOTRON_30B_API_KEY:-}
      POOLSIDE_LAGUNA_XS_2P1: ${POOLSIDE_LAGUNA_XS_2P1:-}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      GOOGLE_API_KEY_FREE_TIER: ${GOOGLE_API_KEY_FREE_TIER:-}
      OPEN_ROUTER_API_KEY: ${OPEN_ROUTER_API_KEY:-}
    depends_on:
      migrate: {condition: service_completed_successfully}

  worker:
    <<: *app
    logging: {driver: none}
    command: [jarvis, worker]
    environment:
      <<: *runtime-environment
      JARVIS_S07_SYNTHETIC_TRIAL_APPROVED: ${JARVIS_S07_SYNTHETIC_TRIAL_APPROVED:-false}
      NEMOTRON_30B_API_KEY: ${NEMOTRON_30B_API_KEY:-}
      POOLSIDE_LAGUNA_XS_2P1: ${POOLSIDE_LAGUNA_XS_2P1:-}
      KIMI_K3_API_KEY: ${KIMI_K3_API_KEY:-}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      GOOGLE_API_KEY_FREE_TIER: ${GOOGLE_API_KEY_FREE_TIER:-}
      OPEN_ROUTER_API_KEY: ${OPEN_ROUTER_API_KEY:-}
    depends_on:
      migrate: {condition: service_completed_successfully}

volumes:
  database:

networks:
  application:
