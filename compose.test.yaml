# Standalone test project: no application services, credentials, network, or volume.
name: jarvis-tests

services:
  test-db:
    image: pgvector/pgvector:0.8.6-pg17-bookworm@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
    environment:
      POSTGRES_DB: jarvis_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: synthetic-test-admin
      APP_USER: jarvis_test_app
      APP_PASSWORD: synthetic-test-runtime
      MIGRATION_USER: jarvis_test_migrate
      MIGRATION_PASSWORD: synthetic-test-migration
    volumes:
      - test-database:/var/lib/postgresql/data
      - ./docker/postgres/init-db.sh:/docker-entrypoint-initdb.d/10-jarvis.sh:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U postgres -d jarvis_test']
      interval: 2s
      timeout: 3s
      retries: 30

  tests:
    image: jarvis:local
    build: .
    init: true
    environment:
      JARVIS_ENV: test
      JARVIS_DB_HOST: test-db
      JARVIS_DB_NAME: jarvis_test
      JARVIS_DB_USER: jarvis_test_app
      JARVIS_DB_PASSWORD: synthetic-test-runtime
      JARVIS_TEST_MIGRATION_PASSWORD: synthetic-test-migration
    depends_on:
      test-db: {condition: service_healthy}
    command: [pytest, -q, -p, no:cacheprovider]

  # Browser checks use only this isolated backend, never the application volume.
  web:
    profiles: [browser]
    image: jarvis:local
    build: .
    init: true
    logging: {driver: none}
    environment:
      JARVIS_ENV: test
      JARVIS_DB_HOST: test-db
      JARVIS_DB_NAME: jarvis_test
      JARVIS_DB_USER: jarvis_test_app
      JARVIS_DB_PASSWORD: synthetic-test-runtime
    ports: ["127.0.0.1:8001:8000"]
    depends_on:
      test-db: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  test-database:
